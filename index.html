<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="刘沣庆 · AI 产品 / AI 应用开发 · 2026 届校园招聘个人简历">
<meta name="theme-color" content="#4f46e5">
<title>刘沣庆 · AI 产品 / AI 应用开发 · 个人简历</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#f5f6fb;
  --topbar-bg:rgba(255,255,255,.78);
  --surface:#ffffff;
  --surface-2:#f2f4fa;
  --text:#141726;
  --text-2:#565d78;
  --text-3:#8b92aa;
  --border:#e6e9f2;
  --border-strong:#d6daea;
  --primary:#4f46e5;
  --primary-2:#7c5cff;
  --primary-soft:#eef0ff;
  --accent:#06b6d4;
  --accent-soft:#e6f9fd;
  --glow-1:rgba(79,70,229,.16);
  --glow-2:rgba(6,182,212,.14);
  --shadow-sm:0 1px 2px rgba(20,23,38,.05);
  --shadow:0 1px 2px rgba(20,23,38,.04), 0 10px 24px -10px rgba(20,23,38,.16);
  --shadow-lg:0 2px 6px rgba(20,23,38,.05), 0 24px 48px -18px rgba(20,23,38,.25);
  --radius:16px;
  --radius-sm:10px;
}
html[data-theme="dark"]{
  --bg:#0b0d17;
  --topbar-bg:rgba(14,17,28,.76);
  --surface:#141726;
  --surface-2:#1b1f33;
  --text:#eef1f8;
  --text-2:#a7adc4;
  --text-3:#7a8099;
  --border:#242941;
  --border-strong:#333a58;
  --primary:#8b8bff;
  --primary-2:#a78bfa;
  --primary-soft:#1e2142;
  --accent:#22d3ee;
  --accent-soft:#0e2d38;
  --glow-1:rgba(124,92,255,.22);
  --glow-2:rgba(34,211,238,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5), 0 26px 52px -20px rgba(0,0,0,.85);
}

/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  scroll-padding-top:84px;
  -webkit-text-size-adjust:100%;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:15px;
  line-height:1.7;
  color:var(--text);
  background:
    radial-gradient(1100px 560px at 8% -8%, var(--glow-1), transparent 62%),
    radial-gradient(900px 520px at 100% 2%, var(--glow-2), transparent 58%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background-color .25s ease,color .25s ease;
}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:700;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--primary);color:#fff}

.container{width:100%;max-width:1100px;margin:0 auto;padding:0 20px}

.skip-link{
  position:absolute;left:-9999px;top:0;z-index:100;
  background:var(--primary);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;font-size:14px;
}
.skip-link:focus{left:0}

/* ============ 顶栏 ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--topbar-bg);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
  transition:background-color .25s ease,border-color .25s ease;
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:0 16px;
  height:60px;display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 6px 16px -6px rgba(79,70,229,.7);
}
.brand-text{font-weight:700;font-size:15px;letter-spacing:.02em}
.nav-links{
  display:flex;gap:2px;align-items:center;justify-content:center;
  flex:1;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{
  position:relative;padding:7px 12px;border-radius:8px;font-size:14px;
  color:var(--text-2);white-space:nowrap;transition:color .18s ease,background-color .18s ease;
}
.nav-link:hover{color:var(--text);background:var(--surface-2)}
.nav-link.active{color:var(--primary);font-weight:600;background:var(--primary-soft)}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  cursor:pointer;transition:all .18s ease;
}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px)}
.icon-btn svg{width:17px;height:17px}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:10px;font-size:13.5px;font-weight:600;
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease,color .18s ease;
}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;box-shadow:0 8px 20px -8px rgba(79,70,229,.75);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(79,70,229,.85)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.btn-soft{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.btn-soft:hover{transform:translateY(-2px)}

/* ============ Hero ============ */
.hero{position:relative;overflow:hidden;padding:118px 0 56px}
.hero::before,.hero::after{
  content:'';position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;
}
.hero::before{width:400px;height:400px;background:var(--primary);top:-160px;left:-100px;opacity:.18}
.hero::after{width:320px;height:320px;background:var(--accent);top:10px;right:-110px;opacity:.15}
.hero .container{position:relative;z-index:1}
.hero-inner{
  display:grid;grid-template-columns:1.35fr .85fr;gap:36px;align-items:start;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;color:var(--primary);
  background:var(--primary-soft);border-radius:999px;padding:6px 14px;
  margin-bottom:18px;
}
.eyebrow .dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft);animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.35);opacity:.65}
}
.hero-name{
  font-size:clamp(38px,6vw,58px);
  font-weight:800;letter-spacing:-.03em;line-height:1.1;
  background:linear-gradient(120deg,var(--text) 30%,var(--primary) 70%,var(--accent));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.hero-role{
  margin-top:8px;font-size:clamp(16px,2.2vw,19px);font-weight:600;color:var(--text-2);
}
.hero-desc{
  margin-top:16px;max-width:620px;color:var(--text-2);font-size:14.5px;
}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.badge{
  display:inline-flex;align-items:center;
  padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:500;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);
  transition:all .18s ease;
}
.badge:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

/* Hero 联系卡片 */
.contact-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);
}
.contact-card h3{
  font-size:13px;font-weight:700;color:var(--text-3);
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;
}
.contact-list{display:flex;flex-direction:column;gap:4px}
.contact-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;border-radius:10px;transition:background-color .18s ease;
}
.contact-item:hover{background:var(--surface-2)}
.contact-icon{
  width:32px;height:32px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary);
}
.contact-icon svg{width:15px;height:15px}
.contact-body{min-width:0;flex:1}
.contact-label{font-size:11.5px;color:var(--text-3);line-height:1.3}
.contact-value{
  font-size:13.5px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.copy-btn{
  position:relative;width:28px;height:28px;flex-shrink:0;border-radius:8px;
  display:grid;place-items:center;border:1px solid var(--border);
  background:var(--surface);color:var(--text-3);cursor:pointer;
  transition:all .18s ease;
}
.copy-btn:hover{color:var(--primary);border-color:var(--primary)}
.copy-btn.ok{color:#10b981;border-color:#10b981}
.copy-btn svg{width:13px;height:13px}
.copy-btn::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(3px);
  background:var(--text);color:var(--surface);font-size:11px;font-weight:500;
  padding:3px 8px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;z-index:5;
}
.copy-btn[data-tip]::after{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 区块 ============ */
.section{padding:52px 0;scroll-margin-top:80px}
.section-head{margin-bottom:26px}
.section-head h2{
  display:flex;align-items:center;gap:11px;
  font-size:clamp(20px,2.6vw,25px);
}
.section-head h2::before{
  content:'';width:6px;height:22px;border-radius:3px;flex-shrink:0;
  background:linear-gradient(180deg,var(--primary),var(--accent));
}
.section-head p{margin-top:6px;padding-left:17px;font-size:13.5px;color:var(--text-3)}

/* ============ 卡片 ============ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow-sm);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}

/* ============ 亮点 ============ */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.hl-card{position:relative;overflow:hidden}
.hl-card::after{
  content:'';position:absolute;inset:auto -30% -60% auto;width:150px;height:150px;
  border-radius:50%;background:var(--primary);opacity:.06;transition:transform .35s ease;
}
.hl-card:hover::after{transform:scale(1.4)}
.hl-num{
  display:flex;align-items:baseline;gap:3px;
  font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.hl-num small{font-size:14px;font-weight:700;-webkit-text-fill-color:var(--text-3);color:var(--text-3)}
.hl-title{margin-top:10px;font-size:15px;font-weight:700;position:relative;z-index:1}
.hl-desc{margin-top:6px;font-size:13px;color:var(--text-2);position:relative;z-index:1}

/* ============ Tabs ============ */
.tablist{
  display:inline-flex;gap:4px;padding:5px;margin-bottom:22px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
  max-width:100%;overflow-x:auto;scrollbar-width:none;
}
.tablist::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:0;background:transparent;color:var(--text-2);
  font-size:13.5px;font-weight:500;padding:8px 16px;border-radius:999px;
  cursor:pointer;white-space:nowrap;
  transition:color .18s ease,background-color .18s ease,box-shadow .18s ease;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{
  background:var(--surface);color:var(--primary);font-weight:700;
  box-shadow:var(--shadow-sm);
}
.tab:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.tabpanel{animation:fadeUp .28s ease both}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* ============ 时间线 ============ */
.timeline{position:relative;padding-left:28px}
.timeline::before{
  content:'';position:absolute;left:7px;top:10px;bottom:10px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--primary),var(--accent));opacity:.28;
}
.tl-item{position:relative;margin-bottom:26px}
.tl-item:last-child{margin-bottom:0}
.tl-item::before{
  content:'';position:absolute;left:-26px;top:8px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2.5px solid var(--primary);
  box-shadow:0 0 0 4px var(--primary-soft);
}
.tl-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;justify-content:space-between}
.tl-title{font-size:16px;font-weight:700}
.tl-time{
  font-size:12.5px;font-weight:600;color:var(--text-3);
  background:var(--surface-2);padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.tl-role{margin-top:3px;font-size:13.5px;font-weight:600;color:var(--primary)}
.points{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.points li{
  position:relative;padding-left:18px;font-size:13.8px;color:var(--text-2);line-height:1.75;
}
.points li::before{
  content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--accent));
}

/* ============ 项目卡片 ============ */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px}
.proj-card{display:flex;flex-direction:column;gap:12px}
.proj-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.proj-type{
  font-size:11.5px;font-weight:700;letter-spacing:.04em;
  color:var(--accent);background:var(--accent-soft);
  padding:4px 10px;border-radius:999px;
}
html[data-theme="dark"] .proj-type{color:#67e8f9}
.proj-time{font-size:12.5px;color:var(--text-3);font-weight:500}
.proj-name{font-size:17px;font-weight:700}
.proj-desc{font-size:13.5px;color:var(--text-2)}
.stack{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:11.8px;font-weight:500;padding:4px 10px;border-radius:7px;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);
}
.proj-result{
  margin-top:auto;display:flex;gap:9px;align-items:flex-start;
  padding:11px 13px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));
  font-size:13px;color:var(--text-2);line-height:1.65;
}
.result-label{
  flex-shrink:0;font-size:11px;font-weight:700;color:#fff;letter-spacing:.05em;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  padding:2px 8px;border-radius:6px;margin-top:2px;
}

/* ============ 技能 ============ */
.skill-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.skill-group h3{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:700;margin-bottom:18px;color:var(--text);
}
.skill-group h3::before{
  content:'';width:8px;height:8px;border-radius:3px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
}
.skill-row{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin-bottom:15px}
.skill-row:last-child{margin-bottom:0}
.skill-name{font-size:13.5px;color:var(--text-2);font-weight:500}
.skill-pct{
  font-size:12px;color:var(--text-3);font-weight:600;
  font-variant-numeric:tabular-nums;
}
.bar{grid-column:1/-1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:width .9s cubic-bezier(.2,.8,.2,1);
}

/* ============ 教育 & 证书 ============ */
.two-col{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:start}
.edu-school{font-size:17px;font-weight:700}
.edu-major{margin-top:4px;font-size:14px;font-weight:600;color:var(--primary)}
.edu-meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.edu-meta .chip{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.course-title{margin-top:18px;font-size:12.5px;font-weight:700;color:var(--text-3);letter-spacing:.06em}
.courses{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.cert-item{
  display:flex;gap:13px;padding:14px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--border);
  transition:transform .18s ease,border-color .18s ease;
}
.cert-item + .cert-item{margin-top:11px}
.cert-item:hover{transform:translateX(3px);border-color:var(--primary)}
.cert-badge{
  width:38px;height:38px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;
  box-shadow:0 8px 18px -8px rgba(79,70,229,.8);
}
.cert-badge svg{width:18px;height:18px}
.cert-name{font-size:14px;font-weight:700}
.cert-org{margin-top:2px;font-size:12.5px;color:var(--text-2)}
.cert-foot{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--text-3)}
.cert-foot span{
  background:var(--surface);border:1px solid var(--border);
  padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;
}

/* ============ 待补占位 ============ */
.pending{
  color:var(--text-3);
  border-bottom:1px dashed var(--border-strong);
  padding-bottom:1px;
}

/* ============ 页脚 ============ */
.footer{
  margin-top:24px;padding:30px 0 36px;
  border-top:1px solid var(--border);
  background:var(--surface);
}
.footer-inner{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  font-size:13px;color:var(--text-3);
}
.footer-links{display:flex;flex-wrap:wrap;gap:16px}
.footer-links a{transition:color .18s ease}
.footer-links a:hover{color:var(--primary)}

/* ============ 返回顶部 ============ */
.to-top{
  position:fixed;right:22px;bottom:22px;z-index:40;
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .22s ease,transform .22s ease,visibility .22s,color .18s ease,border-color .18s ease;
}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-3px)}
.to-top svg{width:18px;height:18px}

/* ============ 进入动效 ============ */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ============ 头像 ============ */
.hero-title-row{display:flex;align-items:center;gap:20px}
.hero-avatar{
  width:104px;height:130px;object-fit:cover;flex-shrink:0;
  border-radius:14px;border:1px solid var(--border);
  box-shadow:var(--shadow);background:var(--surface-2);
}
.hero-title-text{min-width:0}

/* ============ 证书缩略图 ============ */
.cert-thumb{
  width:92px;height:66px;object-fit:cover;flex-shrink:0;margin-left:auto;
  border-radius:8px;border:1px solid var(--border);cursor:zoom-in;
  background:var(--surface);
  transition:transform .18s ease,border-color .18s ease;
}
.cert-thumb:hover{transform:scale(1.04);border-color:var(--primary)}

/* ============ 图片查看器 ============ */
.lightbox{
  position:fixed;inset:0;z-index:120;display:none;
  align-items:center;justify-content:center;padding:28px;
  background:rgba(10,12,22,.9);cursor:zoom-out;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.lightbox.show{display:flex}
.lightbox img{
  max-width:min(94vw,1100px);max-height:86vh;border-radius:12px;
  background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.65);
}
.lightbox-tip{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  color:#cfd3e4;font-size:12.5px;letter-spacing:.04em;
}
@media (max-width:560px){
  .hero-title-row{gap:14px}
  .hero-avatar{width:76px;height:96px;border-radius:12px}
  .cert-thumb{width:74px;height:54px}
}
@media print{
  .lightbox{display:none !important}
  .hero-avatar,.cert-thumb{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .hero-inner{grid-template-columns:1fr;gap:26px}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:760px){
  body{font-size:14.5px}
  .topbar-inner{height:56px;padding:0 12px;gap:10px}
  .brand-text{display:none}
  .nav-link{padding:6px 9px;font-size:13px}
  .btn{padding:8px 12px;font-size:13px}
  .hero{padding:96px 0 44px}
  .section{padding:40px 0}
  .proj-grid,.skill-groups,.hl-grid{grid-template-columns:1fr}
  .to-top{right:14px;bottom:14px;width:40px;height:40px}
  .footer-inner{flex-direction:column;align-items:flex-start}
}
@media (max-width:520px){
  .container{padding:0 16px}
  .card{padding:16px}
  .hero-actions .btn{flex:1 1 auto;justify-content:center}
}

/* ============ 打印 ============ */
@page{margin:13mm}
@media print{
  html,html[data-theme="dark"]{
    --bg:#fff;--surface:#fff;--surface-2:#f6f7f9;--text:#111;--text-2:#3d3d3d;--text-3:#6b6b6b;
    --border:#dcdcdc;--border-strong:#c8c8c8;--primary:#3730a3;--primary-2:#4f46e5;
    --primary-soft:#f0f0ff;--accent:#0e7490;--accent-soft:#eefafd;--topbar-bg:#fff;
    --shadow:none;--shadow-sm:none;--shadow-lg:none;--glow-1:transparent;--glow-2:transparent;
  }
  body{
    background:#fff !important;color:#111 !important;
    font-size:10.8pt;line-height:1.55;
  }
  .topbar,.to-top,.tablist,.no-print,.hero-actions,.copy-btn,.skip-link{display:none !important}
  .hero{padding:0 0 14px !important}
  .hero::before,.hero::after{display:none !important}
  .section{padding:12px 0 !important;break-inside:avoid}
  .container{padding:0 !important;max-width:none !important}
  .card,.contact-card,.cert-item{
    box-shadow:none !important;border:1px solid #e3e3e3 !important;
    break-inside:avoid;page-break-inside:avoid;
  }
  .card:hover,.cert-item:hover{transform:none !important}
  .tabpanel[hidden]{display:block !important}
  .tabpanel + .tabpanel{margin-top:12px}
  .tabpanel{animation:none !important}
  .reveal{opacity:1 !important;transform:none !important}
  .proj-grid,.skill-groups,.hl-grid,.two-col{grid-template-columns:1fr 1fr;gap:10px}
  .hero-name{
    font-size:26pt !important;color:#111 !important;
    -webkit-text-fill-color:#111 !important;background:none !important;
  }
  .hero-inner{grid-template-columns:1.5fr 1fr;gap:16px}
  .hl-num{font-size:18pt !important;color:#3730a3 !important;-webkit-text-fill-color:#3730a3 !important;background:none !important}
  .section-head h2{font-size:14pt}
  .points li,.proj-desc,.hl-desc{font-size:9.6pt}
  a[href]::after{content:''}
  .footer{margin-top:10px;padding:12px 0;background:#fff}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
  .reveal{opacity:1 !important;transform:none !important}
}
</style>

<main id="main">

  <!-- ================= Hero ================= -->
  <section class="hero" id="hero">
    <div class="container" id="heroInner"></div>
  </section>

  <!-- ================= 亮点成果 ================= -->
  <section class="section" id="highlights">
    <div class="container">
      <div class="section-head reveal">
        <h2>亮点成果</h2>
        <p>30 秒速览：认证 · 能力 · 方向</p>
      </div>
      <div class="hl-grid" id="hlGrid"></div>
    </div>
  </section>

  <!-- ================= 经历 ================= -->
  <section class="section" id="experience">
    <div class="container">
      <div class="section-head reveal">
        <h2>经历</h2>
        <p>校园经历与个人实践</p>
      </div>
      <div id="experienceBody"></div>
    </div>
  </section>

  <!-- ================= 项目 ================= -->
  <section class="section" id="projects">
    <div class="container">
      <div class="section-head reveal">
        <h2>项目经历</h2>
        <p>从需求拆解到成果落地的完整实践</p>
      </div>
      <div id="projectsBody"></div>
    </div>
  </section>

  <!-- ================= 技能 ================= -->
  <section class="section" id="skills">
    <div class="container">
      <div class="section-head reveal">
        <h2>技能矩阵</h2>
        <p>AI 与数据 · 编程与工程 · 内容与领域</p>
      </div>
      <div class="skill-groups" id="skillsBody"></div>
    </div>
  </section>

  <!-- ================= 教育与证书 ================= -->
  <section class="section" id="education">
    <div class="container">
      <div class="section-head reveal">
        <h2>教育与证书</h2>
        <p>学历背景与专业认证</p>
      </div>
      <div class="two-col" id="eduBody"></div>
    </div>
  </section>

</main>

  <div class="container footer-inner" id="footerInner"></div>
</footer>

          node.addEventListener(key.slice(2).toLowerCase(), val);

        }

    }
    for (let i = 2; i < arguments.length; i++) {

      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' +
      (extra ? ' ' + extra : '') + '>' + paths + '</svg>';
  }

  const ICONS = {
    phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 6-10 7L2 6"></path>',
    pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle>',
    code: '<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"></path>',
    link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>',
    copy: '<rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
    award: '<circle cx="12" cy="8" r="6"></circle><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path>'
  };

  function copyToClipboard(text) {
    return new Promise(function (resolve) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(fallback()); });
          return;
        }
      } catch (e) { /* ignore */ }
      resolve(fallback());

      function fallback() {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0;';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, text.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (e) {
          return false;
        }
      }
    });
  }

  /* =========================================================
   * 三、联系方式（含邮箱运行时拼接，防爬虫）
   * ======================================================= */
  function getContacts() {
    const c = resume.contacts || {};
    const out = [];

    if (c.phone) {
      out.push({ label: '手机', value: c.phone, href: 'tel:' + c.phone, copy: c.phone, icon: 'phone' });
    }
    const e = c.email;
    const mail = (e && e[0] && e[1]) ? (e[0] + '@' + e[1]) : '';
    if (mail) {
      out.push({ label: '邮箱', value: mail, href: 'mailto:' + mail, copy: mail, icon: 'mail' });
    }
    if (c.city) {
      out.push({ label: '现居', value: c.city, icon: 'pin' });
    }
    if (c.github) {
      out.push({ label: 'GitHub / 作品集', value: c.github, href: c.github, icon: 'code' });
    }
    if (c.linkedin) {
      out.push({ label: 'LinkedIn', value: c.linkedin, href: c.linkedin, icon: 'link' });
    }
    return out;
  }

  function makeCopyButton(text) {
    const btn = el('button', {
      class: 'copy-btn',
      type: 'button',
      'aria-label': '复制：' + text,
      title: '复制',
      html: svg(ICONS.copy)
    });
    btn.addEventListener('click', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      copyToClipboard(text).then(function (ok) {
        btn.classList.toggle('ok', ok);
        btn.setAttribute('data-tip', ok ? '已复制' : '复制失败');
        clearTimeout(btn._timer);
        btn._timer = setTimeout(function () {
          btn.classList.remove('ok');
          btn.removeAttribute('data-tip');
        }, 1400);
      });
    });
    return btn;
  }

  /* =========================================================
   * 四、Tabs 组件（ARIA + 键盘左右切换）
   * ======================================================= */
  function buildTabs(container, tabs) {
    container.innerHTML = '';
    if (!tabs || !tabs.length) return;

    const list = el('div', { class: 'tablist', role: 'tablist', 'aria-label': '内容切换' });
    const panels = el('div', { class: 'tabpanels' });
    const buttons = [];

    function select(index) {
      buttons.forEach(function (b, j) {
        const on = index === j;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        panels.children[j].hidden = !on;
      });
    }

    tabs.forEach(function (t, i) {
      const btn = el('button', {
        class: 'tab',
        type: 'button',
        role: 'tab',
        id: 'tab-' + t.id,
        'aria-controls': 'panel-' + t.id,
        'aria-selected': i === 0 ? 'true' : 'false',
        tabindex: i === 0 ? '0' : '-1',
        text: t.label
      });

      const panel = el('div', {
        class: 'tabpanel',
        role: 'tabpanel',
        id: 'panel-' + t.id,
        'aria-labelledby': 'tab-' + t.id
      });
      if (i !== 0) panel.hidden = true;

      const content = t.render();
      if (content) panel.appendChild(content);

      btn.addEventListener('click', function () { select(i); });
      btn.addEventListener('keydown', function (ev) {
        let next = null;
        if (ev.key === 'ArrowRight') next = (i + 1) % tabs.length;
        else if (ev.key === 'ArrowLeft') next = (i - 1 + tabs.length) % tabs.length;
        else if (ev.key === 'Home') next = 0;
        else if (ev.key === 'End') next = tabs.length - 1;
        if (next !== null) {
          ev.preventDefault();
          select(next);
          buttons[next].focus();
        }
      });

      list.appendChild(btn);
      panels.appendChild(panel);
      buttons.push(btn);
    });

    container.appendChild(list);
    container.appendChild(panels);
    if (tabs.length <= 1) list.style.display = 'none';
  }

  /* =========================================================
   * 五、各模块渲染
   * ======================================================= */
  const NAV_ITEMS = [
    { id: 'hero', label: '首页' },
    { id: 'highlights', label: '亮点' },
    { id: 'experience', label: '经历' },
    { id: 'projects', label: '项目' },
    { id: 'skills', label: '技能' },
    { id: 'education', label: '教育与证书' }
  ];

  function renderNav() {
    const nav = $('#navLinks');
    NAV_ITEMS.forEach(function (item) {
      const section = document.getElementById(item.id);
      if (!section) return;
      nav.appendChild(el('a', {
        class: 'nav-link',
        href: '#' + item.id,
        'data-target': item.id,
        text: item.label
      }));
    });

    const links = Array.prototype.slice.call(nav.querySelectorAll('.nav-link'));
    if (!('IntersectionObserver' in window)) return;

    const observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        links.forEach(function (l) {
          l.classList.toggle('active', l.getAttribute('data-target') === entry.target.id);
        });
      });
    }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });

    NAV_ITEMS.forEach(function (item) {
      const s = document.getElementById(item.id);
      if (s) observer.observe(s);
    });
  }

    const contacts = getContacts();

    contacts.forEach(function (c) {

        href: c.href,
        target: c.icon === 'code' || c.icon === 'link' ? '_blank' : null,
        rel: c.icon === 'code' || c.icon === 'link' ? 'noopener' : null

        el('span', { html: svg(ICONS[c.icon] || ICONS.link), style: { display: 'inline-flex' } }),
        el('span', { text: c.label + '：' + c.value })
      ));
    });

    actions.appendChild(el('a', {
      class: 'btn btn-soft',
      href: '#projects'
    },

      el('span', { html: '→' })
    ));

    const main = el('div', { class: 'hero-main' },
      el('div', { class: 'eyebrow' },
        el('span', { class: 'dot' }),
        el('span', { text: resume.tagline + ' · 开放 AI 产品 / 开发岗位机会' })
      ),
      el('div', { class: 'hero-title-row' },
        resume.avatar ? el('img', {
          class: 'hero-avatar',
          src: resume.avatar,
          alt: resume.name + ' 头像'
        }) : null,
        el('div', { class: 'hero-title-text' }, nameEl, roleEl)

      descEl,

      actions
    );

    const contactList = el('div', { class: 'contact-list' });
    if (contacts.length) {
      contacts.forEach(function (c) {
        const iconBox = el('div', { class: 'contact-icon', html: svg(ICONS[c.icon] || ICONS.link) });
        const body = el('div', { class: 'contact-body' },
          el('div', { class: 'contact-label', text: c.label }),
          el('div', { class: 'contact-value', text: c.value })
        );
        const row = el('div', { class: 'contact-item' }, iconBox, body);
        if (c.href) {
          const link = el('a', { href: c.href, style: { display: 'contents' } }, iconBox, body);

  function renderHighlights() {
    const grid = $('#hlGrid');
    const data = resume.highlights || [];
    if (!data.length) { $('#highlights').hidden = true; return; }

    data.forEach(function (h, i) {
      const card = el('article', { class: 'card hl-card reveal' },
        el('div', { class: 'hl-num' },
          el('span', { text: h.value }),
          el('small', { text: h.unit || '' })
        ),
        el('div', { class: 'hl-title', text: h.title }),
        el('p', { class: 'hl-desc', html: markPending(h.desc) })
      );
      card.style.transitionDelay = (i * 60) + 'ms';
      grid.appendChild(card);
    });

  function renderExperience() {
    const host = $('#experienceBody');
    const groups = (resume.experience || []).filter(function (g) {
      return g.items && g.items.length;
    });
    if (!groups.length) { $('#experience').hidden = true; return; }

    buildTabs(host, groups.map(function (g) {
      return {
        id: 'exp-' + g.group,

        render: function () {
          const tl = el('div', { class: 'timeline' });
          g.items.forEach(function (item) {
            tl.appendChild(el('div', { class: 'tl-item' },
              el('div', { class: 'tl-head' },
                el('h3', { class: 'tl-title', html: markPending(item.org) }),
                item.time ? el('span', { class: 'tl-time', text: item.time }) : null
              ),
              item.role ? el('div', { class: 'tl-role', text: item.role }) : null,
              el('ul', { class: 'points' },
                (item.points || []).map(function (p) {
                  return el('li', { html: markPending(p) });
                })
              )
            ));
          });

        }
      };
    }));

  function projectCard(p) {
    const card = el('article', { class: 'card proj-card' });

    card.appendChild(el('div', { class: 'proj-top' },
      el('span', { class: 'proj-type', text: p.typeLabel }),
      p.time ? el('span', { class: 'proj-time', text: p.time }) : null
    ));

    card.appendChild(el('h3', { class: 'proj-name', html: markPending(p.name) }));
    card.appendChild(el('p', { class: 'proj-desc', html: markPending(p.desc) }));

    if (p.points && p.points.length) {
      card.appendChild(el('ul', { class: 'points' },
        p.points.map(function (x) { return el('li', { html: markPending(x) }); })
      ));
    }

    if (p.stack && p.stack.length) {
      card.appendChild(el('div', { class: 'stack' },
        p.stack.map(function (s) { return el('span', { class: 'chip', text: s }); })
      ));
    }

    if (p.result) {
      card.appendChild(el('div', { class: 'proj-result' },
        el('span', { class: 'result-label', text: '成果' }),
        el('span', { html: markPending(p.result) })
      ));
    }

    if (p.link) {
      card.appendChild(el('a', {
        class: 'btn btn-ghost',
        href: p.link,
        target: '_blank',
        rel: 'noopener',
        style: { alignSelf: 'flex-start' },
        text: '查看项目 →'
      }));
    }
    return card;
  }

  function renderProjects() {
    const host = $('#projectsBody');
    const all = resume.projects || [];
    if (!all.length) { $('#projects').hidden = true; return; }

    const cats = [];
    all.forEach(function (p) {
      if (cats.indexOf(p.category) === -1) cats.push(p.category);
    });

    const catLabels = { course: '课程 / 竞赛', personal: '个人实践' };
    const tabs = [{ id: 'all', label: '全部', filter: function () { return all; } }];
    cats.forEach(function (c) {
      tabs.push({
        id: c,
        label: catLabels[c] || c,
        filter: function () {
          return all.filter(function (p) { return p.category === c; });
        }
      });
    });

    buildTabs(host, tabs.map(function (t) {
      return {
        id: 'proj-' + t.id,
        label: t.label,
        render: function () {
          const grid = el('div', { class: 'proj-grid' });
          t.filter().forEach(function (p) { grid.appendChild(projectCard(p)); });
          return grid;
        }
      };
    }));
  }

  function renderSkills() {
    const host = $('#skillsBody');
    const groups = resume.skills || [];
    if (!groups.length) { $('#skills').hidden = true; return; }

    groups.forEach(function (g) {
      const card = el('div', { class: 'card skill-group reveal' },
        el('h3', { text: g.group })
      );

      g.items.forEach(function (s) {
        const bar = el('div', { class: 'bar' },
          el('i', { 'data-level': s.level })
        );
        card.appendChild(el('div', { class: 'skill-row' },
          el('span', { class: 'skill-name', text: s.name }),
          el('span', { class: 'skill-pct', text: s.level + '%' }),
          bar
        ));
      });

      host.appendChild(card);
    });

  function animateBars() {
    const bars = document.querySelectorAll('.bar > i[data-level]');
    if (!bars.length) return;

    function fill(bar) {
      const level = bar.getAttribute('data-level') || 0;
      if (prefersReduced || !('IntersectionObserver' in window)) {
        bar.style.width = level + '%';
        return;
      }
      const io = new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          const target = entry.target;
          requestAnimationFrame(function () {
            setTimeout(function () { target.style.width = target.getAttribute('data-level') + '%'; }, 60);
          });
          obs.unobserve(target);
        });
      }, { threshold: 0.25 });
      io.observe(bar);
    }

    Array.prototype.forEach.call(bars, fill);
  }

    const host = $('#eduBody');
    const edu = resume.education;
    const certs = resume.certificates || [];

    if (!edu && !certs.length) { $('#education').hidden = true; return; }

      eduCard.appendChild(el('div', { class: 'edu-school', text: edu.school }));

        certCard.appendChild(el('div', { class: 'cert-item' },
          el('div', { class: 'cert-badge', html: svg(ICONS.award) }),
          el('div', { class: 'cert-body' },
            el('div', { class: 'cert-name', html: markPending(ct.name) }),
            ct.org ? el('div', { class: 'cert-org', text: ct.org }) : null,
            (ct.date || ct.id) ? el('div', { class: 'cert-foot' },

              ct.id ? el('span', { text: '编号 ' + ct.id }) : null
            ) : null

    host.appendChild(eduCard);

    const host = $('#footerInner');
    if (!host) return;
    const year = new Date().getFullYear();
    host.appendChild(el('span', {
      text: '© ' + year + ' ' + resume.name + ' · ' + resume.role
    }));

    getContacts().forEach(function (c) {
      if (!c.href) return;
      links.appendChild(el('a', {
        href: c.href,
        target: (c.icon === 'code' || c.icon === 'link') ? '_blank' : null,
        rel: (c.icon === 'code' || c.icon === 'link') ? 'noopener' : null,
        text: c.label + '：' + c.value
      }));
    });

  }

  /* =========================================================
   * 六、交互：主题 / 打印 / 返回顶部 / 进场动效
   * ======================================================= */
  function initTheme() {
    const btn = $('#themeBtn');
    if (!btn) return;
    const rootEl = document.documentElement;
    const iconSun = $('#iconSun');
    const iconMoon = $('#iconMoon');

    function apply(theme) {
      rootEl.setAttribute('data-theme', theme);
      try { localStorage.setItem('resume-theme', theme); } catch (e) { /* ignore */ }
      if (iconSun) iconSun.style.display = (theme === 'dark') ? 'none' : '';
      if (iconMoon) iconMoon.style.display = (theme === 'dark') ? '' : 'none';
    }

    let saved = null;
    try { saved = localStorage.getItem('resume-theme'); } catch (e) { /* ignore */ }
    if (saved !== 'light' && saved !== 'dark') {
      saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    apply(saved);

    btn.addEventListener('click', function () {
      apply(rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }

  function initPrint() {
    const btn = $('#printBtn');
    if (btn) btn.addEventListener('click', function () { window.print(); });
  }

  function initToTop() {
    const btn = $('#toTop');
    if (!btn) return;
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: prefersReduced ? 'auto' : 'smooth' });
    });
    function update() {
      btn.classList.toggle('show', window.scrollY > 480);
    }
    window.addEventListener('scroll', update, { passive: true });
    update();
  }

  function initReveal() {
    const items = document.querySelectorAll('.reveal');
    if (!items.length) return;
    if (prefersReduced || !('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(items, function (n) { n.classList.add('in'); });
      return;
    }
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('in');
        io.unobserve(entry.target);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    Array.prototype.forEach.call(items, function (n) { io.observe(n); });
  }

  function initLightbox() {
    const thumbs = document.querySelectorAll('.cert-thumb');
    if (!thumbs.length) return;

    const tip = el('div', { class: 'lightbox-tip', text: '点击任意处关闭（Esc）' });
    const img = el('img', { alt: '' });
    const box = el('div', {
      class: 'lightbox', role: 'dialog', 'aria-modal': 'true', 'aria-label': '证书大图'
    }, img, tip);
    document.body.appendChild(box);

    function open(src, alt) {
      img.src = src;
      img.alt = alt || '';
      box.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      box.classList.remove('show');
      document.body.style.overflow = '';
      img.removeAttribute('src');
    }

    Array.prototype.forEach.call(thumbs, function (t) {
      t.addEventListener('click', function () {
        open(t.getAttribute('data-full') || t.src, t.alt);
      });
    });
    box.addEventListener('click', close);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && box.classList.contains('show')) close();
    });
  }

  /* =========================================================
   * 七、启动
   * ======================================================= */
  function init() {
    renderNav();
    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderSkills();
    renderEducation();
    renderFooter();
    animateBars();
    initReveal();
    initTheme();
    initPrint();
    initToTop();
    initLightbox();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
